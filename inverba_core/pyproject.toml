[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inverba-core"
version = "0.1.2"
description = "Sovereign, verifiable, swarm-distributable web extraction engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Harrington Crest Holdings LLC" }]
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.8",
    "cryptography>=42",
    "click>=8.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
mcp = ["mcp>=1.0"]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
temporal = ["asn1crypto>=1.5"]        # RFC 3161 trusted timestamping (temporal.py)
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "langchain-core>=0.3", "asn1crypto>=1.5"]

[project.scripts]
inverba = "inverba.cli:main"
inverba-mcp = "inverba.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
